---
- name: Install redis on Ubuntu
  apt:
    name: "{{ redis_package }}={{ redis_version }}*"
    state: present
    update_cache: yes

- name: Copy redis config file from template
  template:
    src: redis.conf.j2
    dest: "{{ redis_conf_path }}"
  notify: restart redis

- name: Start and enable redis
  service:
    name: "{{ redis_service }}"
    state: started
    enabled: yes